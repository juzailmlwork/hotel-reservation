  #       run: |
  #         echo "OS:      $(uname -a)"
  #         echo "User:    $(whoami)"
  #         echo "Folder:  $(pwd)"
  #         echo "Node:    $(node -v)  npm: $(npm -v)"
  #         echo "CPUs:    $(nproc)"
  #         df -h . | tail -1
