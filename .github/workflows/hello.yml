name: Hello

# ---------------------------------------------------------------
# TRIGGERS - push and pull_request are commented out for teaching.
# Uncomment them and push to see the workflow run automatically.
# Note: `on:` needs at least ONE trigger, otherwise GitHub says
# "Invalid workflow file ... Unexpected value ''". That's why the
# manual trigger stays on.
# ---------------------------------------------------------------
on:
  # 1. Manual run: adds a "Run workflow" button on the Actions tab.
  workflow_dispatch:

  # 2. Runs on every push to the dev branch.
  push:
    branches: [dev]

  # 3. Runs when a pull request targets the dev branch.
  # pull_request:
  #   branches: [dev]

jobs:
  hello:
    name: Say hello
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repo
        uses: actions/checkout@v4

      - name: Introduce myself
        run: echo "My name is Jusail"

      - name: Tell the time
        run: echo "The time now is $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Count files in Admin-frontend
        run: |
          pwd
          echo "----------------------------------------"
          cd Admin-frontend
          pwd
          echo "Files in Admin frontend:"
          ls -a
  
