# =====================================================================
# CI EXAMPLES FOR TEACHING - everything below is commented out.
#
# This file lives in .github/ (NOT .github/workflows/), so GitHub never
# runs it. To try a lesson:
#   1. Copy the lesson's job into .github/workflows/ci.yml under `jobs:`
#      (or copy this whole file into .github/workflows/ and uncomment).
#   2. Uncomment it, commit, push, and watch the Actions tab.
# Lessons are ordered roughly from easiest to hardest.
# =====================================================================

name: CI examples

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
#
#   # -----------------------------------------------------------------
#   # LESSON 0: more ways to trigger a workflow
#   # -----------------------------------------------------------------
#   # Adds a "Run workflow" button on the Actions tab (manual run).
#   workflow_dispatch:
#
#   # Runs on a timer (cron syntax, UTC). This one is every Monday 06:00.
#   # Useful for catching breakage from new dependency versions.
#   schedule:
#     - cron: '0 6 * * 1'

jobs:
  -----------------------------------------------------------------
  # LESSON 1: Matrix builds - run the same job on several Node versions
  # Concept: `strategy.matrix` creates one job per value.
  # -----------------------------------------------------------------
  backend-matrix:
    name: Backend tests on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # keep running other versions if one fails
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test

  # -----------------------------------------------------------------
  # LESSON 2: Artifacts - save files produced by a job
  # Concept: upload the built frontend (dist/) so it can be downloaded
  # from the run's summary page or used by a later job.
  # -----------------------------------------------------------------
  admin-frontend-artifact:
    name: Admin frontend - upload build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Admin-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Admin-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-frontend-dist
          path: Admin-frontend/dist
          retention-days: 7

  # -----------------------------------------------------------------
  # LESSON 3: Test coverage report
  # Concept: produce a coverage report and keep it as an artifact.
  # Backend: Jest has coverage built in.
  # Frontend: needs `npm i -D @vitest/coverage-v8` first, then
  #           `npx vitest run --coverage`.
  # -----------------------------------------------------------------
  backend-coverage:
    name: Backend - coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: Backend/coverage

  # -----------------------------------------------------------------
  # LESSON 4: Security audit of dependencies
  # Concept: fail the pipeline if a dependency has a known high/critical
  # vulnerability. `--omit=dev` only checks what ships to production.
  # -----------------------------------------------------------------
  # audit:
  #   name: npm audit (${{ matrix.project }})
  #   runs-on: ubuntu-latest
  #   strategy:
  #     matrix:
  #       project: [Backend, Admin-frontend]
  #   defaults:
  #     run:
  #       working-directory: ${{ matrix.project }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #     - run: npm audit --omit=dev --audit-level=high

  # -----------------------------------------------------------------
  # LESSON 5: Multi-line Linux commands in one step
  # Concept: `run: |` keeps line breaks, so a step can be a small bash
  # script - variables, loops, if/else, functions. Each step runs in a
  # fresh shell; GitHub uses `bash -e` so the step fails on the first
  # failing command. `set -euo pipefail` makes it even stricter.
  # $GITHUB_STEP_SUMMARY is a file whose Markdown shows on the run page.
  # -----------------------------------------------------------------
  # multi-line-demo:
  #   name: Multi-line shell demo
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
