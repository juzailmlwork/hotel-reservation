name: CI pipeline for backend and admin frontend

on:
  push:
    branches: [dev, main]
    # paths:
    #   - 'Backend/**'
    #   - 'Admin-frontend/**'
  pull_request:
    branches: [dev, main]
    # paths:
    #   - 'Backend/**'
    #   - 'Admin-frontend/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level env variable: plain text, visible to every job.
# Read it with ${{ env.NODE_VERSION }} (in YAML) or $NODE_VERSION (in shell).
env:
  NODE_VERSION: 24

jobs:
  # ---------------------------------------------------------------
  # Detect which folders changed (dorny/paths-filter).
  # Unlike `on: push: paths:` (which skips the WHOLE workflow), this
  # lets each job decide for itself whether to run.
  # Outputs are the strings 'true' / 'false'.
  # ---------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read      # paths-filter reads the PR's changed files
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # On push, compare with the previous commit on THIS branch.
          # Without this, a push to any branch other than the repo's default
          # branch (dev) is compared against dev, so main sees every
          # difference between dev and main as "changed".
          # (Ignored on pull_request - PRs always use the PR's own files.)
          base: ${{ github.ref_name }}
          filters: |
            backend:
              - 'Backend/**'
            frontend:
              - 'Admin-frontend/**'

      - name: Show result
        run: |
          echo "Backend changed:  ${{ steps.filter.outputs.backend }}"
          echo "Frontend changed: ${{ steps.filter.outputs.frontend }}"

  backend:
    name: Backend - lint, build & test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint must come AFTER install: ESLint is a devDependency.
      - name: Lint
        run: npm run lint

      - name: Build (syntax check all source files)
        run: find src tests -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build (verify app loads)
        run: node -e "require('./src/app')"

      - name: Run tests
        run: npm test

  admin-frontend:
    name: Admin frontend - lint, build & test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Admin-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Admin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------
  # Deploy (demo). Shows:
  #   - `needs`: waits for both jobs above to finish without failing
  #   - `if`: only runs on a push to main (never on PRs)
  #   - `environment`: groups secrets/variables; can require approval
  #   - secrets  -> ${{ secrets.NAME }}  (encrypted, masked in logs)
  #   - variables -> ${{ vars.NAME }}    (plain text, shown in logs)
  #
  # Set them up in GitHub: Settings > Secrets and variables > Actions
  #   Secret:   JWT_SECRET  (e.g. a long random string)
  #   Variable: API_URL     (e.g. https://api.example.com/api)
  # ---------------------------------------------------------------
  deploy:
    name: Deploy (demo)
    runs-on: ubuntu-latest
    # `needs` makes deploy wait for both check jobs. Without it, deploy
    # starts at the SAME TIME and still "deploys" even if checks FAIL.
    needs: [backend, admin-frontend]
    # By default a job is SKIPPED if any job it needs was skipped - and with
    # paths-filter one of them often is. So the condition is spelled out:
    #   !failure() && !cancelled()          -> no needed job failed / was cancelled
    #   contains(needs.*.result, 'success') -> at least ONE check job really ran
    #                                          and passed (if both were skipped,
    #                                          nothing changed, so nothing to deploy)
    if: >-
      !failure() && !cancelled() &&
      contains(needs.*.result, 'success') &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      VITE_API_URL: ${{ vars.API_URL || 'http://localhost:5004/api' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Admin-frontend/package-lock.json

      - name: Show variables (safe to print)
        run: |
          echo "Node version (env):  $NODE_VERSION"
          echo "API URL (variable):  $VITE_API_URL"
          echo "Branch:              ${{ github.ref_name }}"
          echo "Commit:              ${{ github.sha }}"

      - name: Check secret (value is masked as ***)
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "::warning::JWT_SECRET is not set. Add it under Settings > Secrets and variables > Actions."
          else
            echo "JWT_SECRET is set. Printing it shows: $JWT_SECRET"
          fi

      - name: Build admin frontend with the API URL variable
        working-directory: Admin-frontend
        run: |
          npm ci
          npm run build

      - name: Deploy (placeholder)
        run: echo "Build ready in Admin-frontend/dist - a real deploy step would upload it here."
