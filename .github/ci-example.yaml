  #           echo "::notice::Big backend ($count files)"
  #         else
  #           echo "::notice::Small backend ($count files)"
  #         fi
  #
  #     - name: Folded command (`>` joins lines into ONE command)
  #       run: >
  #         find Backend/src -name '*.js'
  #         -exec wc -l {} +

  # -----------------------------------------------------------------
  # LESSON 6: Passing data between jobs (job outputs)
  # Concept: each job runs on a NEW machine, so variables don't carry
  # over. To hand a value to another job:
  #   1. A step writes   name=value   into the file $GITHUB_OUTPUT
  #      (the step needs an `id` so we can refer to it)
  #   2. The job lists it under `outputs:` (step output -> job output)
  #   3. The next job `needs:` it and reads
  #      ${{ needs.<job>.outputs.<name> }}
  # This is exactly how `changes` -> `backend` works in ci.yml.
  # -----------------------------------------------------------------
  producer:
    name: Make some values
    runs-on: ubuntu-latest
    outputs:                                   # 2. expose to other jobs
      greeting: ${{ steps.make.outputs.greeting }}
      file_count: ${{ steps.make.outputs.file_count }}
    steps:
      - uses: actions/checkout@v4
      - name: Create values
        id: make                               # 1. step id
        run: |
          echo "greeting=Hello from the producer job" >> "$GITHUB_OUTPUT"
          echo "file_count=$(find Backend/src -type f | wc -l)" >> "$GITHUB_OUTPUT"
  
  consumer:
    name: Use the values
    runs-on: ubuntu-latest
    needs: producer                            # 3. wait for producer...
    steps:
      - name: Read producer's outputs          # ...and read its outputs
        run: |
          echo "Message:            ${{ needs.producer.outputs.greeting }}"
          echo "Backend file count: ${{ needs.producer.outputs.file_count }}"
  
  big-backend:
    name: Only runs if backend has more than 5 files
    runs-on: ubuntu-latest
    needs: producer
    if: needs.producer.outputs.file_count > 5  # outputs can drive `if` too
    steps:
      - run: echo "Backend is big (${{ needs.producer.outputs.file_count }} files)"
